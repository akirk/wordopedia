	<rect width="128" height="128" rx="26" ry="26" fill="#f8f9fa"/>
	<circle cx="64" cy="64" r="45.44" fill="none" stroke="#202122" stroke-width="4"/>
	<text x="64" y="79.2" font-family="Georgia, 'Times New Roman', Times, 'Nimbus Roman', serif" font-size="46.08" fill="#202122" text-anchor="middle">W</text>
</svg>
